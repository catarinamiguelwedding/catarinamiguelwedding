			<div class="row row-bottom-padded-md">
				<div class="col-md-12">
					<ul id="fh5co-gallery-list"></ul>

					<script>
						const galleryList = document.getElementById("fh5co-gallery-list");

						for (let i = 0; i <= 110; i++) {
							const li = document.createElement("li");
							li.className = "one-third animate-box";
							li.setAttribute("data-animate-effect", "fadeIn");
							li.style.backgroundImage = `url(images/${i}.jpeg)`;

							const a = document.createElement("a");
							a.href = `images/${i}.jpeg`;
							a.className = "color-4";
							a.setAttribute("download", `foto_${i}.jpeg`); // botão download

							

							li.appendChild(a);
							galleryList.appendChild(li);
						}
						</script>
				</div>

	<script src="https://unpkg.com/i18next@21.6.2/dist/umd/i18next.min.js"></script>
	<script>
		const resources = {};

	function loadJSON(lang, callback) {
	$.getJSON(`locales/${lang}.json`, function (data) {
		resources[lang] = { translation: data };
		callback();
	}).fail(function () {
		console.error(`Erro ao carregar o arquivo locales/${lang}.json`);
	});
	}

	function initializeI18Next(lang) {
	i18next.init({
		lng: lang,
		debug: true,
		resources
	}, function (err, t) {
		if (err) return console.error('Erro no i18next:', err);
		updateContent();
		initializeCountdown();
	});
	}

	function updateContent() {
	$('[data-i18n]').each(function () {
		const key = $(this).data('i18n');
		$(this).text(i18next.t(key));
	});
	}

	function initializeCountdown() {
	document.querySelector('.simply-countdown-one').innerHTML = '';

	simplyCountdown('.simply-countdown-one', {
		year: 2025,
		month: 5,
		day: 31,
		hours: 16,
		minutes: 0,
		seconds: 0,
		enableUtc: true,
		words: {
		days: i18next.t('countdown.days'),
		hours: i18next.t('countdown.hours'),
		minutes: i18next.t('countdown.minutes'),
		seconds: i18next.t('countdown.seconds')
		},
		plural: true
	});
	}

	function changeLanguage(lang) {
	localStorage.setItem('selectedLanguage', lang);
	loadJSON(lang, function () {
		initializeI18Next(lang);
	});
	}

	const savedLanguage = localStorage.getItem('selectedLanguage') || 'en';
	loadJSON(savedLanguage, function () {
	initializeI18Next(savedLanguage);
	});

	$(document).on('click', '.dropdown-menu a', function (e) {
    e.preventDefault();
    const lang = $(this).data('lang');
    changeLanguage(lang);

    $(this).closest('.dropdown-menu').parent().removeClass('open');
});
$(document).on('click', function (e) {
    if (!$(e.target).closest('.dropdown').length) {
        $('.dropdown').removeClass('open');
    }
});


	</script>
